name: Release plugin assets
on:
  push:
    branches: [main]
    paths: ['main.js', 'manifest.json', 'styles.css', 'versions.json']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: wechat-public-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installation files
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in main.js manifest.json styles.css; do test -s "$file"; done
          node --check main.js
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@v3
        if: steps.version.outputs.exists != 'true'
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.exists != 'true'
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          body: '微信复制、图表复制需离线授权。普通复制与预览免费。请下载三个安装文件，放入 yuhanbo-wechat-public 插件目录。'
          files: |
            main.js
            manifest.json
            styles.css
